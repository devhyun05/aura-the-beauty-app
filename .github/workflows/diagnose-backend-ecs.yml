name: Diagnose Backend ECS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME || 'aura-backend-api' }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

jobs:
  diagnose:
    name: Read ECS failure evidence
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Report service events and stopped tasks
        shell: bash
        run: |
          set -u
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{status:status,runningCount:runningCount,pendingCount:pendingCount,deployments:deployments[*].{id:id,status:status,rolloutState:rolloutState,rolloutStateReason:rolloutStateReason,taskDefinition:taskDefinition},events:events[0:15].[createdAt,message]}' \
            --output json

          mapfile -t task_arns < <(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status STOPPED \
            --max-items 20 \
            --query 'taskArns' \
            --output text | tr '\t' '\n')

          if [ "${#task_arns[@]}" -eq 0 ] || [ -z "${task_arns[0]}" ]; then
            echo "No stopped tasks were returned."
            exit 0
          fi

          aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "${task_arns[@]}" \
            --query 'tasks[*].{taskArn:taskArn,taskDefinitionArn:taskDefinitionArn,createdAt:createdAt,stoppedAt:stoppedAt,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[*].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}' \
            --output json

          for task_arn in "${task_arns[@]}"; do
            task_id="${task_arn##*/}"
            task_definition="$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$task_arn" \
              --query 'tasks[0].taskDefinitionArn' \
              --output text)"
            log_group="$(aws ecs describe-task-definition \
              --task-definition "$task_definition" \
              --query "taskDefinition.containerDefinitions[?name=='$ECS_CONTAINER_NAME']|[0].logConfiguration.options.\"awslogs-group\"" \
              --output text)"
            stream_prefix="$(aws ecs describe-task-definition \
              --task-definition "$task_definition" \
              --query "taskDefinition.containerDefinitions[?name=='$ECS_CONTAINER_NAME']|[0].logConfiguration.options.\"awslogs-stream-prefix\"" \
              --output text)"
            log_stream="$stream_prefix/$ECS_CONTAINER_NAME/$task_id"

            echo "Log stream: $log_group :: $log_stream"
            aws logs get-log-events \
              --log-group-name "$log_group" \
              --log-stream-name "$log_stream" \
              --limit 100 \
              --query 'events[*].message' \
              --output text || true
          done

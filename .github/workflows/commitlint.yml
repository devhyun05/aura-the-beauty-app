name: Commit Message Lint

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check commit messages on push
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          # 새 브랜치(0000...)이거나 force-push로 이전 커밋이 사라져 조회 불가하면
          # 범위 대신 마지막 커밋만 검사한다(force-push 시 spurious 실패 방지).
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || \
             ! git rev-parse --verify --quiet "$BEFORE^{commit}" > /dev/null; then
            npx commitlint --last --verbose
          else
            npx commitlint --from="$BEFORE" --to="${{ github.sha }}" --git-log-args="--first-parent" --verbose
          fi

      - name: Check commit messages on pull request
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint --from="${{ github.event.pull_request.base.sha }}" --to="${{ github.event.pull_request.head.sha }}" --verbose

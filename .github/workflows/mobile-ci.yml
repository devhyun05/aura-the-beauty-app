name: Mobile CI

# dev/main 으로 가는 PR 에서 모바일 앱의 타입·컨트랙트 회귀를 머지 전에 잡고,
# dev 병합 직후에도 같은 검사를 다시 실행해 머지 커밋·직접 push 회귀를 확인한다.
# 도입 배경: 컨트랙트 테스트가 로컬 전용이라 PR #224(020cb33) 같은 회귀가
# 머지 시점에 걸러지지 않았다. 전부 node 전용(시뮬레이터/기기 불필요)이라 빠르다.
#
# Required status check 안전 설계: 트리거에 paths 필터를 쓰면 모바일을 안 건드린
# PR 에서 워크플로가 아예 생성되지 않아, Required 지정 시 그 PR 이 영원히
# "Expected" 로 막힌다. 대신 항상 트리거하고 changes 잡이 변경을 감지해 무관 PR
# 에선 본 잡을 skip 한다 — GitHub 은 skip 된 잡을 Required 통과로 취급한다.

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
    paths:
      - "apps/mobile/**"
      - "apps/unity/**"
      - "scripts/mobile/**"
      - "scripts/ios/**"
      - "scripts/face-ratio/**"
      - "scripts/face3d/**"
      - "docs/face3d/FACE3D_GATE_STATUS.json"
      - "package.json"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # changes 잡이 pulls/{n}/files API 로 변경 파일을 조회한다. permissions 블록을
  # 하나라도 선언하면 미지정 권한은 none 이 되므로, private repo 에서 이 API 가
  # 403 으로 막혀 changes 잡이 계약 실행 전에 실패한다. 명시적으로 부여.
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mobile: ${{ steps.filter.outputs.changed }}
      native_geometry: ${{ steps.filter.outputs.native_geometry }}
    steps:
      - name: Detect mobile-related changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mark_all_changed() {
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "native_geometry=true" >> "$GITHUB_OUTPUT"
          }

          EVENT_NAME="${{ github.event_name }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mark_all_changed
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            # 새 브랜치처럼 before 가 0으로만 구성되거나 compare API 가 실패하면
            # 변경 감지를 추측하지 않고 모든 검사를 실행한다.
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              mark_all_changed
              exit 0
            fi

            if ! comparison=$(gh api "repos/${{ github.repository }}/compare/${BEFORE}...${AFTER}"); then
              echo "compare API 실패 — 안전하게 전체 검사"
              mark_all_changed
              exit 0
            fi

            # Compare API 는 파일을 최대 300개까지만 제공한다. 상한에 닿으면
            # 목록이 불완전할 수 있으므로 전체 검사를 실행한다.
            compared_files=$(jq '.files | length' <<< "$comparison")
            if [ "$compared_files" -ge 300 ]; then
              echo "변경 파일이 compare API 300개 상한에 도달 — 안전하게 전체 검사"
              mark_all_changed
              exit 0
            fi

            files=$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<< "$comparison")
          else
            # pull_request 이벤트는 PR files API 로 rename 전·후 경로를 모두 본다.
            # 최대 3,000개를 넘으면 열거가 불완전하므로 전체 검사한다.
            changed_files=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
              --jq '.changed_files')
            if [ "${changed_files:-0}" -ge 3000 ]; then
              echo "변경 파일 ${changed_files}개 — PR files API 3000 상한으로 열거 불완전 → 전체 검사."
              mark_all_changed
              exit 0
            fi

            files=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" \
              --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          fi

          # here-string(<<<)을 써서 grep -q 조기 종료에 따른 SIGPIPE 오판을 막는다.
          # Unity source와 face-ratio/·face3d/ 오프라인 계약도 이 잡에서 실행하므로
          # 변경 감지에 포함한다. Unity Editor 빌드는 하지 않고 아래 정적 계약만 검사한다.
          if grep -qE '^(apps/mobile/|apps/unity/|scripts/mobile/|scripts/ios/|scripts/face-ratio/|scripts/face3d/|docs/face3d/FACE3D_GATE_STATUS\.json$|package\.json$|\.github/workflows/mobile-ci\.yml$)' <<< "$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "모바일 관련 변경 없음 — 본 잡은 skip 되며 Required 체크는 통과 처리된다."
          fi

          if grep -qE '^(apps/mobile/ios/AURA/AURARealtimeGeometry\.h|scripts/ios/realtimeGeometryGolden\.test\.m|scripts/ios/run-realtime-geometry-golden\.mjs|scripts/mobile/fixtures/realtime-geometry-golden\.json|\.github/workflows/mobile-ci\.yml)$' <<< "$files"; then
            echo "native_geometry=true" >> "$GITHUB_OUTPUT"
          else
            echo "native_geometry=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.mobile == 'true'

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies for cross-layer contract
        run: python -m pip install -r ../../services/backend/requirements.txt

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Contract — Secure credential storage
        run: node ../../scripts/mobile/run-secure-store-contract.mjs

      - name: Contract — Consulting booking and chat flow
        run: npm run test:consulting-flow

      - name: Contract — Face capture and analysis request verification
        run: npm run test:face-capture-upload

      - name: Contract — Makeup feedback camera quality
        run: npm run test:makeup-feedback-camera-quality

      - name: Contract — Makeup feedback cross-layer response
        run: npm run test:makeup-feedback-cross-layer

      - name: Contract — Makeup journey calendar
        run: npm run test:makeup-journey

      - name: Contract — Realtime face quality native bridge
        run: npm run test:realtime-face-quality-native

      - name: Contract — Realtime capture frame metadata
        run: npm run test:realtime-capture-frame-native

      - name: Contract — Cognito redirect URI
        run: npm run test:cognito-redirect

      - name: Contract — Unity makeup bridge (랜드마크 요청/응답 포함)
        run: npm run test:unity-bridge

      - name: Contract — Personal color engine (5축·12톤)
        run: npm run test:personal-color

      - name: Contract — Face ratio distortion
        run: npm run test:face-ratio-distortion

      - name: Contract — Face ratio Phase 1 replay
        run: npm run test:face-ratio-phase1

      - name: Contract — Generated brow
        run: npm run test:generated-brow

      - name: Contract — Auradin theme scope
        run: npm run test:auradin-theme-scope

      - name: Contract - iOS bundle identifiers
        run: npm run test:ios-bundle-ids

      - name: Contract - iOS privacy settings
        run: npm run test:ios-privacy

      - name: Contract — Native analyzer wiring (020cb33 류 배선 퇴화 방지)
        run: npm run test:native-wiring

      - name: Contract — Brow native landmark indices
        run: npm run test:brow-native

      - name: Contract — Face3D profile/metric contract
        run: npm run test:face3d

      - name: Contract — Unity Face3D v3 source and runtime preflight tooling
        working-directory: .
        run: |
          # CI에는 Unity 라이선스/빌드 산출물이 없으므로 소스 정적 검사와
          # framework executable + metadata preflight의 fixture 테스트까지만 수행한다.
          npm run face3d:check:unity-source-contract
          npm run face3d:test:unity-runtime-preflight

      - name: Contract — Face3D calibration and fail-closed registry
        working-directory: .
        run: npm run face3d:test:calibration

      - name: Contract — Face geometry 2D metrics (합성 랜드마크 기지값)
        run: npm run test:face-geometry

      - name: Contract — Face analysis measurements (저장·복원 wire 계약)
        run: npm run test:face-analysis-measurements

      # 시맨틱 맵 오프라인 파이프라인(후보/검증/리뷰보드/승인/진단/반복성)은 순수 node
      # 스크립트이고 경로를 import.meta.url 기준으로 풀어 CWD 에 무관하므로, 다른 계약과
      # 동일하게 apps/mobile 에서 ../../ 로 실행한다. scripts/face3d/ 만 바뀐 PR 도 이
      # 잡을 트리거하도록 위 변경 감지에 scripts/face3d/ 를 추가했다.
      - name: Contract — Face3D semantic pipeline (offline)
        run: |
          node ../../scripts/face3d/test-semantic-candidate-core.mjs
          node ../../scripts/face3d/test-semantic-validation.mjs
          node ../../scripts/face3d/test-three-subject-review-board.mjs
          node ../../scripts/face3d/test-approve-semantic-map.mjs
          node ../../scripts/face3d/test-evaluate-semantic-candidate.mjs
          node ../../scripts/face3d/test-analyze-repeatability.mjs
          node ../../scripts/face3d/test-tier2-promotion.mjs

  ios-native-geometry-golden:
    name: iOS native geometry golden
    runs-on: macos-15
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.native_geometry == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Objective-C realtime geometry vectors
        run: node scripts/ios/run-realtime-geometry-golden.mjs

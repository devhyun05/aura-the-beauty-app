name: Mobile CI

# dev/main 으로 가는 PR 에서 모바일 앱의 타입·컨트랙트 회귀를 머지 전에 잡는다.
# 도입 배경: 컨트랙트 테스트가 로컬 전용이라 PR #224(020cb33) 같은 회귀가
# 머지 시점에 걸러지지 않았다. 전부 node 전용(시뮬레이터/기기 불필요)이라 빠르다.
#
# Required status check 안전 설계: 트리거에 paths 필터를 쓰면 모바일을 안 건드린
# PR 에서 워크플로가 아예 생성되지 않아, Required 지정 시 그 PR 이 영원히
# "Expected" 로 막힌다. 대신 항상 트리거하고 changes 잡이 변경을 감지해 무관 PR
# 에선 본 잡을 skip 한다 — GitHub 은 skip 된 잡을 Required 통과로 취급한다.

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  # changes 잡이 pulls/{n}/files API 로 변경 파일을 조회한다. permissions 블록을
  # 하나라도 선언하면 미지정 권한은 none 이 되므로, private repo 에서 이 API 가
  # 403 으로 막혀 changes 잡이 계약 실행 전에 실패한다. 명시적으로 부여.
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mobile: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Detect mobile-related changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "${PR_NUMBER}" ]; then
            # workflow_dispatch 등 PR 컨텍스트 밖에서는 전체 실행
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PR files API 는 최대 3,000개만 반환한다. 변경 파일 수가 그 이상이면
          # 열거가 불완전해 모바일 변경을 놓칠 수 있으므로(fail-open) 안전하게 전체
          # 검사한다. changed_files 는 PR 오브젝트에서 직접 읽는다.
          changed_files=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
            --jq '.changed_files')
          if [ "${changed_files:-0}" -ge 3000 ]; then
            echo "변경 파일 ${changed_files}개 — PR files API 3000 상한으로 열거 불완전 → 전체 검사."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # filename 과 previous_filename 을 함께 본다 — 모바일 파일이 비모바일
          # 경로로 rename-out 되는 경우(filename 만 보면 놓침)도 모바일 변경으로 잡는다.
          files=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          # here-string(<<<)으로 검사한다. 'echo "$files" | grep -q' 는 grep -q 가
          # 매치 즉시 종료할 때 producer(echo)가 SIGPIPE(141)를 받아, 대형 PR
          # (수천 파일)에서 pipefail 이 그걸 실패로 봐 조건이 false→모바일 변경을
          # 못 보고 검사를 건너뛰는 버그가 있었다. here-string 은 producer pipe 가
          # 없어 SIGPIPE 가 나지 않는다.
          if grep -qE '^(apps/mobile/|scripts/mobile/|\.github/workflows/mobile-ci\.yml)' <<< "$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "모바일 관련 변경 없음 — 본 잡은 skip 되며 Required 체크는 통과 처리된다."
          fi

  typecheck-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.mobile == 'true'

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Contract — Secure credential storage
        run: node ../../scripts/mobile/run-secure-store-contract.mjs

      - name: Contract — Face capture and analysis request verification
        run: npm run test:face-capture-upload

      - name: Contract — Unity makeup bridge (랜드마크 요청/응답 포함)
        run: npm run test:unity-bridge

      - name: Contract — Personal color engine (5축·12톤)
        run: npm run test:personal-color

      - name: Contract — Face ratio distortion
        run: npm run test:face-ratio-distortion

      - name: Contract — Generated brow
        run: npm run test:generated-brow

      - name: Contract — Auradin theme scope
        run: npm run test:auradin-theme-scope

      - name: Contract - iOS bundle identifiers
        run: npm run test:ios-bundle-ids

      - name: Contract - iOS privacy settings
        run: npm run test:ios-privacy

      - name: Contract — Native analyzer wiring (020cb33 류 배선 퇴화 방지)
        run: npm run test:native-wiring

      - name: Contract — Brow native landmark indices
        run: npm run test:brow-native

      - name: Contract — Face3D profile/metric contract
        run: npm run test:face3d

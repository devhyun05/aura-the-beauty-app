name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests and upload security integration
    # 백엔드 전체 pytest는 PR마다 약 12~15분의 러너 시간을 사용하므로
    # 비용 안정화 전까지 실행하지 않는다. 잡 이름은 Required check 호환을 위해
    # 유지하고, job-level skip으로 러너와 PostgreSQL을 아예 할당하지 않는다.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Backend tests excluded
        run: echo "Backend tests are temporarily excluded from pull request CI."

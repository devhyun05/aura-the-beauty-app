name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "services/backend/**"
      - "docs/backend/**"
      - "scripts/aws/**"
      - "apps/mobile/eas.json"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/deploy-backend-ecs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests and upload security integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r services/backend/requirements.txt

      - name: Run backend tests
        env:
          AURA_PRODUCT_RECOMMENDATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          AURA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        working-directory: services/backend
        run: python -m pytest -q

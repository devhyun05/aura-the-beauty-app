name: Backend CI

on:
  # PR에서는 실행하지 않는다. 필요할 때만 Actions 화면에서 수동 실행한다.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests and upload security integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r services/backend/requirements.txt

      - name: Run backend tests
        env:
          AURA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        working-directory: services/backend
        run: python -m pytest -q

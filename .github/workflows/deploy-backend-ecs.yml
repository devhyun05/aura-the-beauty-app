name: Deploy Backend to ECS

on:
  push:
    branches:
      - main
    paths:
      - "services/backend/**"
      - "docs/backend/schema.sql"
      - "docs/backend/seed.sql"
      - "data/auradin/catalog/**"
      - "data/auradin/knowledge/**"
      - ".github/workflows/deploy-backend-ecs.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'aura-backend-api' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME || 'aura-backend-api' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION || vars.ECS_SERVICE }}
  CHIME_ENABLED: ${{ vars.CHIME_ENABLED || 'false' }}
  CONSULTING_CALL_ENFORCE_EARLY_WINDOW: ${{ vars.CONSULTING_CALL_ENFORCE_EARLY_WINDOW || 'true' }}
  AI_WORKER_CONTAINER_NAME: ${{ vars.AI_WORKER_CONTAINER_NAME || 'aura-ai-worker' }}
  AI_WORKER_SERVICE: ${{ vars.AI_WORKER_SERVICE }}
  AI_WORKER_TASK_DEFINITION: ${{ vars.AI_WORKER_TASK_DEFINITION || vars.AI_WORKER_SERVICE }}
  HAIR_WORKER_CONTAINER_NAME: ${{ vars.HAIR_WORKER_CONTAINER_NAME || 'aura-hair-worker' }}
  HAIR_WORKER_SERVICE: ${{ vars.HAIR_WORKER_SERVICE }}
  HAIR_WORKER_TASK_DEFINITION: ${{ vars.HAIR_WORKER_TASK_DEFINITION || vars.HAIR_WORKER_SERVICE }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

jobs:
  deploy:
    name: Build image and deploy service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r services/backend/requirements.txt

      - name: Run backend security and regression tests
        env:
          AURA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        working-directory: services/backend
        run: python -m pytest -q

      - name: Validate deployment configuration
        run: |
          missing=()
          for name in AWS_REGION ECR_REPOSITORY ECS_CLUSTER ECS_CONTAINER_NAME ECS_SERVICE ECS_TASK_DEFINITION; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [ -n "$AI_WORKER_SERVICE" ] && [ -z "$AI_WORKER_TASK_DEFINITION" ]; then
            printf 'AI_WORKER_TASK_DEFINITION is required when AI_WORKER_SERVICE is set.\n' >&2
            exit 1
          fi

          if [ -n "$AI_WORKER_SERVICE" ] && [ -z "$AI_WORKER_CONTAINER_NAME" ]; then
            printf 'AI_WORKER_CONTAINER_NAME is required when AI_WORKER_SERVICE is set.\n' >&2
            exit 1
          fi

          if [ -n "$HAIR_WORKER_SERVICE" ] && [ -z "$HAIR_WORKER_TASK_DEFINITION" ]; then
            printf 'HAIR_WORKER_TASK_DEFINITION is required when HAIR_WORKER_SERVICE is set.\n' >&2
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Configure AWS credentials with access keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image_uri="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          latest_uri="$REGISTRY/$ECR_REPOSITORY:latest"

          docker build \
            -f services/backend/Dockerfile \
            -t "$image_uri" \
            -t "$latest_uri" \
            .

          echo "image=$image_uri" >> "$GITHUB_OUTPUT"
          echo "latest-image=$latest_uri" >> "$GITHUB_OUTPUT"

      - name: Install verified Trivy scanner
        env:
          TRIVY_VERSION: "0.72.0"
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base_url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSLO "$base_url/$archive"
          curl -fsSLo trivy-checksums.txt "$base_url/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "  $archive$" trivy-checksums.txt | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$archive" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"

      - name: Block deploy on critical or high vulnerabilities
        run: >-
          trivy image
          --scanners vuln
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --exit-code 1
          --no-progress
          "${{ steps.build-image.outputs.image }}"

      - name: Push verified backend image
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
          LATEST_URI: ${{ steps.build-image.outputs.latest-image }}
        run: |
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"
      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.raw.json

          jq '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                .environment = ((.environment // []) | map(select(
                  .name != "CONSULTING_CALL_TRANSCRIPTION_ENABLED" and
                  .name != "CHIME_TRANSCRIPTION_ENABLED" and
                  .name != "CHIME_TRANSCRIBE_SUPPORTED_LANGUAGES" and
                  .name != "CHIME_TRANSCRIBE_DEFAULT_LANGUAGE" and
                  .name != "CHIME_TRANSCRIBE_PREFERRED_LANGUAGE" and
                  .name != "CONSULTING_TRANSCRIPT_RETENTION_DAYS" and
                  .name != "CONSULTING_CALL_TRANSLATION_ENABLED" and
                  .name != "CHIME_TRANSLATE_ENABLED"
                )))
              )
          ' task-definition.raw.json > task-definition.json

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            CHIME_ENABLED=${{ env.CHIME_ENABLED }}
            CONSULTING_CALL_ENFORCE_EARLY_WINDOW=${{ env.CONSULTING_CALL_ENFORCE_EARLY_WINDOW }}

      - name: Download current AI worker task definition
        if: ${{ env.AI_WORKER_SERVICE != '' }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$AI_WORKER_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > ai-worker-task-definition.raw.json

          jq '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                .environment = ((.environment // []) | map(select(
                  .name != "CONSULTING_CALL_TRANSCRIPTION_ENABLED" and
                  .name != "CHIME_TRANSCRIPTION_ENABLED" and
                  .name != "CHIME_TRANSCRIBE_SUPPORTED_LANGUAGES" and
                  .name != "CHIME_TRANSCRIBE_DEFAULT_LANGUAGE" and
                  .name != "CHIME_TRANSCRIBE_PREFERRED_LANGUAGE" and
                  .name != "CONSULTING_TRANSCRIPT_RETENTION_DAYS" and
                  .name != "CONSULTING_CALL_TRANSLATION_ENABLED" and
                  .name != "CHIME_TRANSLATE_ENABLED"
                )))
              )
          ' ai-worker-task-definition.raw.json > ai-worker-task-definition.json

          mv ai-worker-task-definition.json ai-worker-task-definition.base.json
          jq --arg worker_container "$AI_WORKER_CONTAINER_NAME" '
            .containerDefinitions |= map(
              if .name == $worker_container then .stopTimeout = 120 else . end
            )
          ' ai-worker-task-definition.base.json > ai-worker-task-definition.json

      - name: Render AI worker task definition
        if: ${{ env.AI_WORKER_SERVICE != '' }}
        id: render-ai-worker-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ai-worker-task-definition.json
          container-name: ${{ env.AI_WORKER_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy API ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Wait for AI job queue to drain
        if: ${{ env.AI_WORKER_SERVICE != '' }}
        run: |
          queue_url="$(
            jq -r --arg container "$AI_WORKER_CONTAINER_NAME" '
              .containerDefinitions[]
              | select(.name == $container)
              | (.environment // [])[]
              | select(.name == "SQS_AI_JOB_QUEUE_URL")
              | .value
            ' ai-worker-task-definition.json
          )"

          if [ -z "$queue_url" ] || [ "$queue_url" = "null" ]; then
            echo "SQS_AI_JOB_QUEUE_URL was not found in the AI worker task definition." >&2
            exit 1
          fi

          for attempt in $(seq 1 60); do
            attributes="$(
              aws sqs get-queue-attributes \
                --queue-url "$queue_url" \
                --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible \
                --output json
            )"
            visible="$(jq -r '.Attributes.ApproximateNumberOfMessages // "0"' <<< "$attributes")"
            in_flight="$(jq -r '.Attributes.ApproximateNumberOfMessagesNotVisible // "0"' <<< "$attributes")"

            if [ "$visible" = "0" ] && [ "$in_flight" = "0" ]; then
              echo "AI job queue is drained."
              break
            fi

            if [ "$attempt" = "60" ]; then
              echo "AI job queue did not drain within 10 minutes: visible=$visible inFlight=$in_flight" >&2
              exit 1
            fi

            echo "Waiting for AI job queue: visible=$visible inFlight=$in_flight"
            sleep 10
          done

      - name: Deploy AI worker ECS service
        if: ${{ env.AI_WORKER_SERVICE != '' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-ai-worker-task-definition.outputs.task-definition }}
          service: ${{ env.AI_WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15
      - name: Download current hair worker task definition
        if: ${{ env.HAIR_WORKER_SERVICE != '' && github.ref == 'refs/heads/main' }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$HAIR_WORKER_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > hair-task-definition.raw.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' hair-task-definition.raw.json > hair-task-definition.json

      - name: Render hair worker task definition
        if: ${{ env.HAIR_WORKER_SERVICE != '' && github.ref == 'refs/heads/main' }}
        id: render-hair-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: hair-task-definition.json
          container-name: ${{ env.HAIR_WORKER_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy hair worker ECS service
        if: ${{ env.HAIR_WORKER_SERVICE != '' && github.ref == 'refs/heads/main' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-hair-task-definition.outputs.task-definition }}
          service: ${{ env.HAIR_WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

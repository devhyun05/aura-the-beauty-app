name: Deploy Backend to ECS

on:
  push:
    branches:
      - main
    paths:
      - "services/backend/**"
      - "docs/backend/schema.sql"
      - "docs/backend/seed.sql"
      - "data/auradin/catalog/**"
      - "data/auradin/knowledge/**"
      - ".github/workflows/deploy-backend-ecs.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy services or only read recent ECS failure evidence
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - diagnose

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'aura-backend-api' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME || 'aura-backend-api' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION || vars.ECS_SERVICE }}
  CHIME_ENABLED: ${{ vars.CHIME_ENABLED || 'false' }}
  CONSULTING_CALL_ENFORCE_EARLY_WINDOW: ${{ vars.CONSULTING_CALL_ENFORCE_EARLY_WINDOW || 'true' }}
  BEDROCK_SCENARIO_MODEL_ID: ${{ vars.BEDROCK_SCENARIO_MODEL_ID || 'global.anthropic.claude-haiku-4-5-20251001-v1:0' }}
  BEDROCK_QUESTION_MODEL_ID: ${{ vars.BEDROCK_QUESTION_MODEL_ID || 'global.anthropic.claude-haiku-4-5-20251001-v1:0' }}
  BEDROCK_RECOMMENDATION_MODEL_ID: ${{ vars.BEDROCK_RECOMMENDATION_MODEL_ID || 'global.anthropic.claude-sonnet-4-6' }}
  AI_WORKER_CONTAINER_NAME: ${{ vars.AI_WORKER_CONTAINER_NAME || 'aura-ai-worker' }}
  AI_WORKER_SERVICE: ${{ vars.AI_WORKER_SERVICE }}
  AI_WORKER_TASK_DEFINITION: ${{ vars.AI_WORKER_TASK_DEFINITION || vars.AI_WORKER_SERVICE }}
  HAIR_WORKER_CONTAINER_NAME: ${{ vars.HAIR_WORKER_CONTAINER_NAME || 'aura-hair-worker' }}
  HAIR_WORKER_SERVICE: ${{ vars.HAIR_WORKER_SERVICE }}
  HAIR_WORKER_TASK_DEFINITION: ${{ vars.HAIR_WORKER_TASK_DEFINITION || vars.HAIR_WORKER_SERVICE }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy' }}
    name: Build image and deploy service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r services/backend/requirements.txt

      - name: Run backend security and regression tests
        env:
          AURA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        working-directory: services/backend
        run: python -m pytest -q

      - name: Validate deployment configuration
        run: |
          missing=()
          for name in AWS_REGION ECR_REPOSITORY ECS_CLUSTER ECS_CONTAINER_NAME ECS_SERVICE ECS_TASK_DEFINITION; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [ -n "$HAIR_WORKER_SERVICE" ] && [ -z "$HAIR_WORKER_TASK_DEFINITION" ]; then
            printf 'HAIR_WORKER_TASK_DEFINITION is required when HAIR_WORKER_SERVICE is set.\n' >&2
            exit 1
          fi

          if [ -n "$AI_WORKER_SERVICE" ] && [ -z "$AI_WORKER_TASK_DEFINITION" ]; then
            printf 'AI_WORKER_TASK_DEFINITION is required when AI_WORKER_SERVICE is set.\n' >&2
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Configure AWS credentials with access keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Report ECS task roles
        run: |
          api_task_role="$(aws ecs describe-task-definition --task-definition "$ECS_TASK_DEFINITION" --query 'taskDefinition.taskRoleArn' --output text)"
          printf 'API task role: %s\n' "$api_task_role"
          echo "::notice title=API ECS task role::$api_task_role"

          if [ -n "$AI_WORKER_TASK_DEFINITION" ]; then
            worker_task_role="$(aws ecs describe-task-definition --task-definition "$AI_WORKER_TASK_DEFINITION" --query 'taskDefinition.taskRoleArn' --output text)"
            printf 'AI worker task role: %s\n' "$worker_task_role"
            echo "::notice title=AI worker ECS task role::$worker_task_role"
          fi

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image_uri="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          latest_uri="$REGISTRY/$ECR_REPOSITORY:latest"

          docker build \
            -f services/backend/Dockerfile \
            -t "$image_uri" \
            -t "$latest_uri" \
            .

          docker push "$image_uri"
          docker push "$latest_uri"

          echo "image=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.raw.json

          jq '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                .environment = ((.environment // []) | map(select(
                  .name != "CONSULTING_CALL_TRANSCRIPTION_ENABLED" and
                  .name != "CHIME_TRANSCRIPTION_ENABLED" and
                  .name != "CHIME_TRANSCRIBE_SUPPORTED_LANGUAGES" and
                  .name != "CHIME_TRANSCRIBE_DEFAULT_LANGUAGE" and
                  .name != "CHIME_TRANSCRIBE_PREFERRED_LANGUAGE" and
                  .name != "CONSULTING_TRANSCRIPT_RETENTION_DAYS" and
                  .name != "CONSULTING_CALL_TRANSLATION_ENABLED" and
                  .name != "CHIME_TRANSLATE_ENABLED"
                )))
              )
          ' task-definition.raw.json > task-definition.json

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            CHIME_ENABLED=${{ env.CHIME_ENABLED }}
            CONSULTING_CALL_ENFORCE_EARLY_WINDOW=${{ env.CONSULTING_CALL_ENFORCE_EARLY_WINDOW }}
            BEDROCK_SCENARIO_MODEL_ID=${{ env.BEDROCK_SCENARIO_MODEL_ID }}
            BEDROCK_QUESTION_MODEL_ID=${{ env.BEDROCK_QUESTION_MODEL_ID }}
            BEDROCK_RECOMMENDATION_MODEL_ID=${{ env.BEDROCK_RECOMMENDATION_MODEL_ID }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Download current AI worker task definition
        if: ${{ env.AI_WORKER_SERVICE != '' }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$AI_WORKER_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > ai-worker-task-definition.raw.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' ai-worker-task-definition.raw.json > ai-worker-task-definition.json

      - name: Render AI worker task definition
        if: ${{ env.AI_WORKER_SERVICE != '' }}
        id: render-ai-worker-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ai-worker-task-definition.json
          container-name: ${{ env.AI_WORKER_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            BEDROCK_SCENARIO_MODEL_ID=${{ env.BEDROCK_SCENARIO_MODEL_ID }}
            BEDROCK_QUESTION_MODEL_ID=${{ env.BEDROCK_QUESTION_MODEL_ID }}
            BEDROCK_RECOMMENDATION_MODEL_ID=${{ env.BEDROCK_RECOMMENDATION_MODEL_ID }}

      - name: Deploy AI worker ECS service
        if: ${{ env.AI_WORKER_SERVICE != '' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-ai-worker-task-definition.outputs.task-definition }}
          service: ${{ env.AI_WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Download current hair worker task definition
        if: ${{ env.HAIR_WORKER_SERVICE != '' }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$HAIR_WORKER_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > hair-task-definition.raw.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' hair-task-definition.raw.json > hair-task-definition.json

      - name: Render hair worker task definition
        if: ${{ env.HAIR_WORKER_SERVICE != '' }}
        id: render-hair-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: hair-task-definition.json
          container-name: ${{ env.HAIR_WORKER_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy hair worker ECS service
        if: ${{ env.HAIR_WORKER_SERVICE != '' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-hair-task-definition.outputs.task-definition }}
          service: ${{ env.HAIR_WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose' }}
    name: Read ECS failure evidence
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Report service events and stopped tasks
        shell: bash
        run: |
          set -u
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{status:status,runningCount:runningCount,pendingCount:pendingCount,deployments:deployments[*].{id:id,status:status,rolloutState:rolloutState,rolloutStateReason:rolloutStateReason,taskDefinition:taskDefinition},events:events[0:15].[createdAt,message]}' \
            --output json

          mapfile -t task_arns < <(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status STOPPED \
            --max-items 20 \
            --query 'taskArns' \
            --output text | tr '\t' '\n')

          if [ "${#task_arns[@]}" -eq 0 ] || [ -z "${task_arns[0]}" ]; then
            echo "No stopped tasks were returned."
            exit 0
          fi

          aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "${task_arns[@]}" \
            --query 'tasks[*].{taskArn:taskArn,taskDefinitionArn:taskDefinitionArn,createdAt:createdAt,stoppedAt:stoppedAt,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[*].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}' \
            --output json

          for task_arn in "${task_arns[@]}"; do
            task_id="${task_arn##*/}"
            task_definition="$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$task_arn" \
              --query 'tasks[0].taskDefinitionArn' \
              --output text)"
            log_group="$(aws ecs describe-task-definition \
              --task-definition "$task_definition" \
              --query "taskDefinition.containerDefinitions[?name=='$ECS_CONTAINER_NAME']|[0].logConfiguration.options.\"awslogs-group\"" \
              --output text)"
            stream_prefix="$(aws ecs describe-task-definition \
              --task-definition "$task_definition" \
              --query "taskDefinition.containerDefinitions[?name=='$ECS_CONTAINER_NAME']|[0].logConfiguration.options.\"awslogs-stream-prefix\"" \
              --output text)"
            log_stream="$stream_prefix/$ECS_CONTAINER_NAME/$task_id"

            echo "Log stream: $log_group :: $log_stream"
            aws logs get-log-events \
              --log-group-name "$log_group" \
              --log-stream-name "$log_stream" \
              --limit 100 \
              --query 'events[*].message' \
              --output text || true
          done

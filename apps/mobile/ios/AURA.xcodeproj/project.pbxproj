			shellScript = "set -e\n\nif [ \"${PLATFORM_NAME}\" != \"iphoneos\" ]; then\n  echo \"[aura:unity] Skipping Unity frameworks embed for ${PLATFORM_NAME}.\"\n  exit 0\nfi\n\nUNITY_BUILD_DIR=\"${SRCROOT}/UnityBuild\"\nUNITY_FRAMEWORK_SRC=\"${UNITY_BUILD_DIR}/UnityFramework.framework\"\nUNITY_DATA_SRC=\"${UNITY_BUILD_DIR}/Data\"\nMEDIAPIPE_FRAMEWORK_SRC=\"${UNITY_BUILD_DIR}/MediaPipeUnity.framework\"\nFRAMEWORKS_DST=\"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\nUNITY_FRAMEWORK_DST=\"${FRAMEWORKS_DST}/UnityFramework.framework\"\nMEDIAPIPE_FRAMEWORK_DST=\"${FRAMEWORKS_DST}/MediaPipeUnity.framework\"\n\nif [ -d \"${UNITY_FRAMEWORK_SRC}\" ]; then\n  echo \"[aura:unity] Embedding UnityFramework from ${UNITY_FRAMEWORK_SRC}\"\n  mkdir -p \"${FRAMEWORKS_DST}\"\n  rsync -a --delete \"${UNITY_FRAMEWORK_SRC}\" \"${FRAMEWORKS_DST}/\"\n  if [ -d \"${UNITY_DATA_SRC}\" ]; then\n    rsync -a --delete \"${UNITY_DATA_SRC}/\" \"${UNITY_FRAMEWORK_DST}/Data/\"\n  else\n    echo \"[aura:unity] Data folder not found at ${UNITY_DATA_SRC}; Unity may fail to load assets.\"\n  fi\n\n  if [ -d \"${MEDIAPIPE_FRAMEWORK_SRC}\" ]; then\n    echo \"[aura:unity] Embedding MediaPipeUnity from ${MEDIAPIPE_FRAMEWORK_SRC}\"\n    mkdir -p \"${FRAMEWORKS_DST}\"\n    rsync -a --delete \"${MEDIAPIPE_FRAMEWORK_SRC}\" \"${FRAMEWORKS_DST}/\"\n    if [ \"${CODE_SIGNING_ALLOWED}\" != \"NO\" ] && [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ]; then\n      /usr/bin/codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --preserve-metadata=identifier,entitlements \"${MEDIAPIPE_FRAMEWORK_DST}\"\n    fi\n  else\n    echo \"[aura:unity] MediaPipeUnity.framework not found at ${MEDIAPIPE_FRAMEWORK_SRC}; UnityFramework cannot load.\" >&2\n  fi\n\n  if [ \"${CODE_SIGNING_ALLOWED}\" != \"NO\" ] && [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ]; then\n    /usr/bin/codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --preserve-metadata=identifier,entitlements \"${UNITY_FRAMEWORK_DST}\"\n  fi\nelse\n  echo \"[aura:unity] UnityFramework.framework not found at ${UNITY_FRAMEWORK_SRC}; skipping embed.\"\nfi\n";

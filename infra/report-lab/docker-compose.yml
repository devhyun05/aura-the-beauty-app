services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aura_report_lab
      POSTGRES_USER: aura_report_lab
      POSTGRES_PASSWORD: "${AURA_REPORT_LAB_DB_PASSWORD:?AURA_REPORT_LAB_DB_PASSWORD is required}"
    ports:
      - "127.0.0.1:${AURA_REPORT_LAB_DB_PORT:-55432}:5432"
    volumes:
      - report_lab_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_report_lab -d aura_report_lab"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 10s

volumes:
  report_lab_postgres:

services:
  postgres:
    # The application schema uses the vector extension; keep local/CI parity
    # with production instead of relying on a plain Postgres image.
    image: pgvector/pgvector:pg16
    container_name: aura-backend-postgres
    environment:
      POSTGRES_DB: aura_backend
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
    ports:
      # Override when the host already runs Postgres, for example
      # `AURA_POSTGRES_PORT=5434 docker compose up -d postgres`.
      - "${AURA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - aura_backend_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aura_backend_postgres:

<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">제품 추천 V2 사용자 플로우와 데이터 경계</title>
  <desc id="desc">홈에서 제품 추천 허브로 진입한 뒤 일반 검색, AR 룩 추천, 시즌 컬렉션, 아우라딘 대화 검색으로 분기하고 제품 상세와 좋아요로 합류하는 흐름. AR 추천은 저장 레시피와 라이선스 상품 카탈로그를 사용하며 네이버 쇼핑 인사이트는 시즌 신호에만 사용한다.</desc>
  <defs>
    <linearGradient id="auradin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CBE2FA"/>
      <stop offset="0.5" stop-color="#D5DAF2"/>
      <stop offset="1" stop-color="#EFD1E5"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#73CCFA"/>
      <stop offset="0.35" stop-color="#C7B8FA"/>
      <stop offset="0.68" stop-color="#F273CC"/>
      <stop offset="1" stop-color="#73EBD1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#3B2E2B" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#5F5955"/>
    </marker>
    <marker id="arrowAccent" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#B85462"/>
    </marker>
    <style>
      .bg { fill: #FAF8F5; }
      .ink { fill: #211F1D; }
      .muted { fill: #716A65; }
      .tiny { font: 500 22px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
      .small { font: 500 26px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
      .body { font: 500 30px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
      .label { font: 700 32px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
      .heading { font: 700 48px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
      .title { font: 700 66px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
      .node { fill: #FFFFFF; stroke: #DED8D2; stroke-width: 2.5; }
      .soft { fill: #F3EFEB; }
      .accentSoft { fill: #F8E6E6; stroke: #E9BFC3; stroke-width: 2; }
      .accent { fill: #B85462; }
      .line { fill: none; stroke: #5F5955; stroke-width: 4; marker-end: url(#arrow); }
      .lineAccent { fill: none; stroke: #B85462; stroke-width: 5; marker-end: url(#arrowAccent); }
      .lineDotted { fill: none; stroke: #827A74; stroke-width: 3; stroke-dasharray: 10 12; marker-end: url(#arrow); }
      .divider { stroke: #E5DFD9; stroke-width: 2; }
      .badge { fill: #211F1D; }
      .badgeText { fill: #FFFFFF; font: 700 21px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="2400" height="1500"/>
  <text x="110" y="100" class="title ink">제품 추천 V2 — 사용자 플로우와 데이터 경계</text>
  <text x="112" y="150" class="body muted">추천 허브가 중심이고, AURADIN은 상단의 작고 선명한 대화형 탐색 입구입니다.</text>

  <!-- Entry -->
  <g filter="url(#shadow)">
    <rect x="90" y="260" width="310" height="180" rx="34" class="node"/>
  </g>
  <rect x="116" y="286" width="78" height="38" rx="19" class="badge"/>
  <text x="155" y="313" text-anchor="middle" class="badgeText">ENTRY</text>
  <text x="122" y="365" class="heading ink">홈</text>
  <text x="122" y="408" class="body muted">추천 제품</text>
  <path d="M402 350 C450 350 465 350 510 350" class="lineAccent"/>

  <!-- Hub phone -->
  <g filter="url(#shadow)">
    <rect x="530" y="210" width="560" height="1100" rx="74" class="node"/>
  </g>
  <rect x="715" y="228" width="190" height="32" rx="16" fill="#211F1D"/>
  <text x="575" y="315" class="heading ink">‹</text>
  <text x="810" y="310" text-anchor="middle" class="label ink">제품 추천</text>
  <text x="994" y="307" class="body ink">♧  ◌</text>
  <line x1="570" y1="342" x2="1050" y2="342" class="divider"/>

  <rect x="575" y="375" width="470" height="72" rx="30" class="soft"/>
  <text x="610" y="420" class="small muted">브랜드·제품명을 검색해 보세요</text>
  <text x="1004" y="421" class="body ink">⌕</text>

  <rect x="575" y="475" width="470" height="124" rx="30" fill="url(#auradin)" stroke="#C8C7E2" stroke-width="2"/>
  <circle cx="625" cy="537" r="34" fill="url(#orb)"/>
  <text x="680" y="520" class="label ink">AURADIN</text>
  <text x="680" y="555" class="small ink">아우라딘에게 물어보기</text>
  <text x="680" y="584" class="tiny muted">색·질감·예산을 말하면 찾아드려요</text>
  <text x="1013" y="548" class="body ink">›</text>

  <text x="575" y="666" class="label ink">저장한 AR 룩과 닮은 제품</text>
  <text x="575" y="700" class="tiny muted">부위 탭 · 선택한 authoring 색·피니시 기준</text>
  <rect x="575" y="728" width="470" height="116" rx="28" class="accentSoft"/>
  <circle cx="626" cy="786" r="30" fill="#C96F72"/>
  <circle cx="650" cy="786" r="30" fill="#E49C90" fill-opacity="0.8"/>
  <text x="700" y="778" class="small ink">로즈 글로우 룩</text>
  <text x="700" y="816" class="tiny muted">립 · 선택색 가까움 · 글로스 일치</text>
  <text x="1000" y="795" class="body ink">›</text>

  <text x="575" y="914" class="label ink">지금 주목할 시즌 룩</text>
  <text x="575" y="948" class="tiny muted">7월 2주차 · 에디터 검수 · 출처 시점 표시</text>
  <rect x="575" y="976" width="470" height="122" rx="28" fill="#E9C3B4"/>
  <text x="612" y="1032" class="label" fill="#FFFFFF">여름 글로우 립</text>
  <text x="612" y="1070" class="tiny" fill="#FFFFFF">최근 검색 클릭 추이 상승</text>

  <text x="575" y="1170" class="label ink">서진님을 위한 추천</text>
  <text x="575" y="1205" class="tiny muted">좋아요·검색·최근 본 제품 — 선택 동의 후</text>
  <rect x="575" y="1232" width="470" height="42" rx="21" class="soft"/>
  <text x="810" y="1261" text-anchor="middle" class="tiny muted">데이터가 부족하면 개인화로 위장하지 않음</text>

  <!-- Branch 1 Search -->
  <path d="M1090 410 C1160 410 1165 290 1240 290" class="line"/>
  <g filter="url(#shadow)"><rect x="1250" y="220" width="320" height="145" rx="30" class="node"/></g>
  <text x="1285" y="273" class="label ink">제품 검색 결과</text>
  <text x="1285" y="314" class="small muted">브랜드·제품명 정확 검색</text>
  <text x="1285" y="347" class="tiny muted">대화 검색과 역할 분리</text>
  <path d="M1572 292 L1675 292" class="line"/>

  <!-- Shared detail -->
  <g filter="url(#shadow)"><rect x="1695" y="215" width="330" height="180" rx="34" class="node"/></g>
  <text x="1733" y="270" class="label ink">인앱 제품 상세</text>
  <text x="1733" y="313" class="small muted">왜 추천됐나요?</text>
  <text x="1733" y="350" class="tiny muted">근거 · 출처 · 광고 여부 · 판매처 CTA</text>
  <path d="M2028 305 L2140 305" class="line"/>
  <rect x="2160" y="245" width="170" height="120" rx="28" class="accentSoft"/>
  <text x="2245" y="297" text-anchor="middle" class="small ink">판매처</text>
  <text x="2245" y="334" text-anchor="middle" class="tiny muted">외부 이동</text>

  <!-- Branch 2 AR -->
  <path d="M1090 790 C1160 790 1160 560 1240 560" class="lineAccent"/>
  <path d="M1305 485 L1400 560 L1305 635 L1210 560 Z" fill="#FFFFFF" stroke="#B85462" stroke-width="3"/>
  <text x="1305" y="551" text-anchor="middle" class="small ink">저장 AR 룩</text>
  <text x="1305" y="585" text-anchor="middle" class="small ink">있음?</text>
  <text x="1418" y="542" class="tiny muted">있음</text>
  <path d="M1402 560 L1535 560" class="lineAccent"/>
  <g filter="url(#shadow)"><rect x="1555" y="490" width="330" height="145" rx="30" class="node"/></g>
  <rect x="1580" y="508" width="54" height="30" rx="15" class="accent"/>
  <text x="1607" y="529" text-anchor="middle" class="badgeText">P0</text>
  <text x="1587" y="574" class="label ink">AR 추천 랭킹</text>
  <text x="1587" y="611" class="tiny muted">authoring ΔE2000 · 피니시 · 품질</text>
  <path d="M1888 560 C1990 560 1990 395 1860 395" class="line"/>

  <text x="1190" y="675" class="tiny muted">없음</text>
  <path d="M1305 637 L1305 724" class="line"/>
  <g filter="url(#shadow)"><rect x="1150" y="744" width="310" height="164" rx="32" class="node"/></g>
  <text x="1184" y="798" class="label ink">AR 룩 만들기</text>
  <text x="1184" y="839" class="small muted">색·질감·강도 조절</text>
  <text x="1184" y="875" class="tiny muted">원본 얼굴은 추천 입력에서 제외</text>
  <path d="M1463 826 L1550 826" class="lineAccent"/>
  <g filter="url(#shadow)"><rect x="1570" y="744" width="315" height="164" rx="32" class="node"/></g>
  <rect x="1595" y="763" width="54" height="30" rx="15" class="accent"/>
  <text x="1622" y="784" text-anchor="middle" class="badgeText">P0</text>
  <text x="1604" y="826" class="label ink">룩 저장 완료</text>
  <text x="1604" y="866" class="small muted">saved_ar_look_v1 · recipe v2</text>
  <path d="M1887 826 C1965 826 1965 670 1740 670 C1510 670 1470 654 1408 598" class="lineAccent"/>

  <!-- Branch 3 Season -->
  <path d="M1090 1038 C1155 1038 1160 1010 1240 1010" class="line"/>
  <g filter="url(#shadow)"><rect x="1260" y="945" width="340" height="150" rx="32" class="node"/></g>
  <text x="1295" y="1000" class="label ink">시즌 컬렉션</text>
  <text x="1295" y="1042" class="small muted">트렌드 신호 + 에디터 검수</text>
  <text x="1295" y="1078" class="tiny muted">유효기간과 출처를 함께 표시</text>
  <path d="M1603 1020 C1740 1020 1740 396 1860 396" class="line"/>

  <!-- Branch 4 Auradin -->
  <path d="M1090 538 C1175 538 1175 1180 1240 1180" class="line"/>
  <g filter="url(#shadow)"><rect x="1260" y="1120" width="340" height="155" rx="32" fill="url(#auradin)" stroke="#C8C7E2" stroke-width="2"/></g>
  <circle cx="1308" cy="1170" r="29" fill="url(#orb)"/>
  <text x="1355" y="1165" class="label ink">AURADIN</text>
  <text x="1295" y="1210" class="small ink">대화 → 질문 → 결과</text>
  <text x="1295" y="1245" class="tiny muted">기존 몰입형 화면 · 명시적 뒤로가기</text>
  <path d="M1603 1197 C2070 1197 2070 396 1860 396" class="line"/>

  <!-- Like convergence -->
  <path d="M1860 398 C1860 550 2060 590 2060 1260" class="lineDotted"/>
  <g filter="url(#shadow)"><rect x="1900" y="1270" width="430" height="120" rx="30" class="node"/></g>
  <text x="1940" y="1323" class="label ink">♡ 좋아요한 제품</text>
  <text x="1940" y="1363" class="small muted">모든 섹션·AURADIN → 동일 서버 저장소</text>

  <!-- Data boundary footer -->
  <rect x="90" y="1370" width="1690" height="70" rx="28" fill="#EEE9E4"/>
  <text x="125" y="1415" class="small ink">상품 원천: 권리 유효한 product · shade · asset · offer</text>
  <text x="870" y="1415" class="small muted">Naver Shopping Insight → 시즌 신호만</text>
  <text x="1355" y="1415" class="small" fill="#B85462">Shopping Search 후보 수집 금지 · 2026-07-31 종료</text>
</svg>
